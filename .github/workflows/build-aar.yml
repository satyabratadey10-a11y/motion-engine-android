name: Build Universal AAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Motion Engine AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Android NDK 25.2.9519653
        run: |
          if [ -d "$ANDROID_SDK_ROOT/ndk/25.2.9519653" ]; then
            echo "NDK 25.2.9519653 found at $ANDROID_SDK_ROOT/ndk/25.2.9519653"
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          else
            echo "NDK 25.2.9519653 not found in preinstalled cache, installing via sdkmanager..."
            yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
            ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build AAR with Gradle
        run: ./gradlew :motion-engine:assembleRelease --no-daemon --stacktrace

      - name: Upload Release AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-engine-release-aar
          path: motion-engine/build/outputs/aar/*.aar
          if-no-files-found: error
